services:
  balancer:
    image: myapp/nginx
    container_name: "nginx-balancer"
    ports:
      - "80:80"
    volumes:
      - ./nginx/balancer.conf:/etc/nginx/conf.d/default.conf
      - ./src:/data/mysite.local
    depends_on:
      - nginx1
      - nginx2

  nginx1:
    image: myapp/nginx
    container_name: "nginx-backend-1"
    volumes:
      - ./nginx/nginx1.conf:/etc/nginx/conf.d/default.conf
      - ./src:/data/mysite.local
    depends_on:
      - php1

  nginx2:
    image: myapp/nginx
    container_name: "nginx-backend-2"
    volumes:
      - ./nginx/nginx2.conf:/etc/nginx/conf.d/default.conf
      - ./src:/data/mysite.local
    depends_on:
      - php2

  php1:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: myapp/fpm
    volumes:
      - ./src:/data/mysite.local

  php2:
    build:
      context: ./fpm
      dockerfile: Dockerfile
    image: myapp/fpm
    volumes:
      - ./src:/data/mysite.local

  redis:
    image: redis:8.6.4-alpine3.23
    container_name: redis_cache
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data: